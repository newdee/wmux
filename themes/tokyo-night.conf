# Tokyo Night for keepane. Loaded from ~/.keepane.conf:
#   source-file ~/.keepane/themes/tokyo-night.conf
#
# Palette: bg #1a1b26  line #3b4261  muted #565f89  fg #a9b1d6
#          blue #7aa2f7  purple #bb9af7  cyan #7dcfff  green #9ece6a  yellow #e0af68
#
# Pieces that need keepane 0.10 (git branch, ~ path, CPU/MEM) are behind
# #{?...}: an older server leaves them out instead of printing blanks.

# Status line: a bar a shade darker than the terminal's Tokyo Night
# background (#1a1b26), so it reads as its own strip.
set -g status-style "fg=#a9b1d6,bg=#16161e"

# Pane borders: quiet lines, the active pane outlined in blue.
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Left: the session name on a blue block.
set -g status-left-length 40
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[default] "

# Windows: muted tabs, the current one on a purple block.
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89] #I:#W#F "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W#F #[default]"

# Right: git branch, directory, CPU / MEM, then the clock on a blue block.
set -g status-right-length 90
set -g status-right "#{?git_branch,#[fg=#bb9af7] #{git_branch} ,}#[fg=#7dcfff]#{?pane_current_path_short,#{pane_current_path_short},#{b:pane_current_path}} #{?cpu_percentage,#[fg=#9ece6a]CPU #{cpu_percentage} #[fg=#e0af68]MEM #{ram_percentage} ,}#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M "
