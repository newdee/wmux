# Nord. Load it from ~/.wmux.conf:
#   source-file ~/.wmux/themes/nord.conf
# (or from wherever you keep this file)

set -g status-style "fg=#d8dee9,bg=#3b4252"
set -g pane-border-style "fg=#434c5e"
set -g pane-active-border-style "fg=#88c0d0"

set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] #S #[default] "
set -g window-status-format "#[fg=#7b88a1] #I:#W#F "
set -g window-status-current-format "#[fg=#eceff4,bg=#4c566a,bold] #I:#W#F "
set -g status-right "#[fg=#81a1c1]#{?pane_current_path,#{pane_current_path} ,}#[fg=#d8dee9]%H:%M "
