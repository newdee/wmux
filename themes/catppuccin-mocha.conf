# Catppuccin Mocha. Load it from ~/.keepane.conf:
#   source-file ~/.keepane/themes/catppuccin-mocha.conf

set -g status-style "fg=#cdd6f4,bg=#313244"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g window-status-format "#[fg=#a6adc8] #I:#W#F "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#F "
set -g status-right "#[fg=#94e2d5]#{?pane_current_path,#{pane_current_path} ,}#[fg=#cdd6f4]%H:%M "
