name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and publish (windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        env:
          WMUX_SESSIONS_DIR: ${{ runner.temp }}\wmux-sessions
        run: cargo test --all-targets
      - name: build
        run: cargo build --release --locked
      - name: package (zip)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "wmux-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force dist\$name | Out-Null
          Copy-Item target\release\wmux.exe, README.md, README.zh-CN.md, wmux.conf.example, LICENSE dist\$name\
          Compress-Archive -Path dist\$name -DestinationPath dist\$name.zip
          $hash = (Get-FileHash dist\$name.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline dist\$name.zip.sha256
          Get-Content dist\$name.zip.sha256
      - name: package (msi)
        shell: pwsh
        run: |
          # Tags are vX.Y.Z; the MSI wants the bare X.Y.Z.
          $version = "${{ github.ref_name }}".TrimStart("v")
          pwsh -File installer/build-msi.ps1 -Version $version -OutDir dist
          $msi = "dist\wmux-$version-windows-x86_64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $msi)" | Set-Content -NoNewline "$msi.sha256"
          Get-Content "$msi.sha256"
      - name: package manifests (winget, scoop)
        shell: pwsh
        run: |
          # From the files just built: hashes and the MSI's ProductCode, no
          # download. The manifests point at this release's asset URLs.
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          pwsh -File tools/package-manifests.ps1 -Version $version `
            -MsiPath "dist\wmux-$version-windows-x86_64.msi" `
            -ZipPath "dist\wmux-$tag-windows-x86_64.zip"
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "packaging\winget\manifests\n\newdee\wmux\$version"
          } else { "winget is not on this runner; the manifests were validated locally before the tag" }
          Compress-Archive -Path packaging\winget, packaging\scoop -DestinationPath "dist\wmux-$version-manifests.zip"
      - name: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist\*.zip dist\*.msi dist\*.sha256 --title "wmux $tag" --generate-notes
      - name: commit the manifests to master
        shell: pwsh
        run: |
          # packaging/ in the repository is the source of `scoop install
          # <raw url>` and of the winget-pkgs pull request, so it follows
          # every release by itself.
          $tag = "${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout is the tag; take the generated files aside, move to
          # master (which may have moved on) and put them back.
          $keep = Join-Path $env:RUNNER_TEMP "packaging"
          Remove-Item -Recurse -Force $keep -ErrorAction SilentlyContinue
          Copy-Item packaging $keep -Recurse
          git checkout -- packaging
          git clean -fdq packaging
          git fetch origin master
          git checkout -B master origin/master
          # Only what the generator writes: packaging/README.md is master's.
          Copy-Item "$keep\winget", "$keep\scoop" packaging -Recurse -Force
          git add packaging
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "manifests unchanged"; exit 0 }
          git commit -m "build: package manifests for $tag"
          git push origin master
