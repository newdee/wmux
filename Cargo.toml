[package]
name = "wmux"
version = "0.10.3"
edition = "2024"
rust-version = "1.88"
description = "A tmux-style terminal multiplexer for Windows (ConPTY, PowerShell, WSL)"
license = "MIT"
repository = "https://github.com/newdee/wmux"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bincode = "1"
chrono = "0.4.45"
dirs = "7.0.0"
log = "0.4.34"
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
unicode-width = "0.2.2"
vt100 = "0.16"
# WinRT toasts (the notification with a "Go to pane" button); everything
# else Win32 goes through windows-sys.
windows = { version = "0.61", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[patch.crates-io]
vt100 = { path = "vendor/vt100" }

