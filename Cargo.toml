[package]
name = "wmux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bincode = "1"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
log = "0.4.34"
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
toml = "1.1.6"
unicode-width = "0.2.2"
vt100 = "0.16"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"
